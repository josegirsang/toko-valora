 <nav class="menu">

<h2>Checkout Pesanan</h2>

<form id="form-checkout" class="form-checkout">

  <label for="nama">Nama Lengkap</label>
  <input type="text" id="nama" placeholder="Masukkan nama kamu" required>

  <label for="alamat">Alamat Pengiriman</label>
  <textarea id="alamat" placeholder="Masukkan alamat lengkap" required></textarea>

  <label for="produk">Produk yang Dipesan</label>
  <input type="text" id="produk" placeholder="Contoh: Kemeja Linen x1" required>

  <button type="submit" class="btn-checkout">Kirim Pesanan via WhatsApp</button>

</form>
